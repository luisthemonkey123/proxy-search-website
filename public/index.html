<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SearchProxy</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="card hero">
        <div class="brand">SearchProxy</div>
        <p class="eyebrow">No Linux required</p>
        <h1>Search the web through a hosted proxy.</h1>
        <p class="lead">
          This version is ready to deploy to Vercel, Render, or any browser-based host.
          You do not need Linux or a local machine setup.
        </p>

        <form id="search-form" class="search-form">
          <input id="search-input" type="search" placeholder="Search anything..." autocomplete="off" />
          <select id="search-engine" aria-label="Search engine">
            <option value="duckduckgo">DuckDuckGo</option>
            <option value="bing">Bing</option>
          </select>
          <button type="submit" class="button primary">Search</button>
        </form>

        <div id="status" class="status">Ready to search.</div>
        <section id="results" class="results" aria-live="polite"></section>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
